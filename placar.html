<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Quiz Arena — Telão</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .public-screen{max-width:1500px;margin:0 auto;padding:clamp(18px,4vw,56px)}
    .public-screen .screen-heading{margin-bottom:clamp(18px,3vw,38px)}
    .public-screen .screen-heading h1{font-size:clamp(2rem,5vw,4.5rem)}
    .public-screen .scoreboard{gap:clamp(12px,2vw,28px);margin:clamp(18px,3vw,34px) 0}
    .public-screen .team-card{padding:clamp(20px,4vw,48px)}
    .public-screen .team-card strong{font-size:clamp(4rem,11vw,9rem)}
    .public-screen .team-label{font-size:clamp(.8rem,1.6vw,1.2rem)}
    .public-screen .question-display{min-height:clamp(230px,34vh,420px);padding:clamp(24px,5vw,64px)}
    .public-screen .question-display h2{font-size:clamp(1.8rem,4.5vw,4rem);max-width:1250px}
    .public-screen .round-status{font-size:clamp(.8rem,1.5vw,1.1rem);margin-top:10px}
    .public-screen .winner-display{font-size:clamp(1.2rem,2.6vw,2.2rem)}
    .public-foot{text-align:center;margin:24px 0;color:var(--muted);font-size:.78rem}
    @media(max-width:560px){.public-screen .scoreboard{grid-template-columns:1fr 1fr}.public-screen .team-card{padding:16px 8px}}
  </style>
</head>
<body data-page="scoreboard">
  <header class="topbar">
    <a class="wordmark" href="index.html">QUIZ <span>ARENA</span></a>
    <span id="connection-status" class="status-pill">Conectando...</span>
  </header>
  <main class="public-screen">
    <div class="screen-heading">
      <div>
        <p class="eyebrow">PLACAR OFICIAL</p>
        <h1 id="event-title">Quiz Arena</h1>
        <p class="muted">Sala: <code id="room-id-label"></code></p>
      </div>
      <span class="live-indicator"><i></i> ATUALIZAÇÃO EM TEMPO REAL</span>
    </div>

    <section class="scoreboard">
      <article class="team-card blue-card">
        <span class="team-label">EQUIPE AZUL</span>
        <strong id="score-a">0</strong>
        <span class="score-caption">PONTOS</span>
      </article>
      <article class="team-card red-card">
        <span class="team-label">EQUIPE VERMELHA</span>
        <strong id="score-b">0</strong>
        <span class="score-caption">PONTOS</span>
      </article>
    </section>

    <section class="question-display">
      <p class="eyebrow">PERGUNTA DA RODADA</p>
      <h2 id="question-display">Aguardando o administrador cadastrar a pergunta...</h2>
      <div id="round-status" class="round-status">AGUARDANDO NOVA RODADA</div>
      <div id="winner-display" class="winner-display"></div>
    </section>
    <p class="public-foot">Quiz Arena · Telão de acompanhamento — somente visualização</p>
  </main>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
